# ===========================================
# MR QR Code - Server Configuration
# ===========================================

# Application
quarkus.application.name=server-qrcode
quarkus.http.port=8080

# CORS - permite acesso do front-end
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:5000,https://www.mrqrcode.site
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization
quarkus.http.cors.exposed-headers=Content-Disposition

# ===========================================
# Database - Dev (H2 in-memory)
# ===========================================
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:mrqrcode;DB_CLOSE_DELAY=-1
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.hibernate-orm.sql-load-script=import.sql

# ===========================================
# Database - Test (H2 in-memory)
# ===========================================
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:mrqrcode_test;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.sql-load-script=import.sql

# ===========================================
# Database - Production (PostgreSQL)
# ===========================================
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USERNAME:mrqrcode}
%prod.quarkus.datasource.password=${DB_PASSWORD:mrqrcode}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mrqrcode}
%prod.quarkus.hibernate-orm.database.generation=update
%prod.quarkus.hibernate-orm.sql-load-script=no-file

# ===========================================
# Logging
# ===========================================
quarkus.log.console.enable=true
quarkus.log.level=INFO
%dev.quarkus.log.level=DEBUG
%dev.quarkus.hibernate-orm.log.sql=true
